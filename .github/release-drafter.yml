name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "🚀 Features"
    labels: ["feature", "enhancement"]
  - title: "🐛 Bug fixes"
    labels: ["bug", "fix"]
  - title: "📚 Documentation"
    labels: ["documentation", "docs"]
  - title: "🧰 Maintenance"
    labels: ["chore", "refactor", "ci", "build", "test"]
  - title: "📦 Dependencies"
    labels: ["dependencies"]
  - title: "💥 Breaking changes"
    labels: ["breaking"]

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels: ["breaking", "major"]
  minor:
    labels: ["feature", "enhancement", "minor"]
  patch:
    labels: ["bug", "fix", "patch", "chore", "refactor", "documentation", "dependencies"]
  default: patch

template: |
  ## What's changed in $RESOLVED_VERSION

  $CHANGES

  **Full changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

  ## Install

  ```bash
  npx steplens@$RESOLVED_VERSION dev
  ```

  Or pull the Docker image:

  ```bash
  docker pull ghcr.io/fabriutola-hub/steplens:$RESOLVED_VERSION
  ```

autolabeler:
  - label: "documentation"
    files:
      - "docs/**"
      - "*.md"
  - label: "ci"
    files:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  - label: "dependencies"
    files:
      - "**/package.json"
      - "pnpm-lock.yaml"
  - label: "bug"
    branch:
      - '/^fix\/.+/'
  - label: "feature"
    branch:
      - '/^feat\/.+/'
  - label: "chore"
    branch:
      - '/^chore\/.+/'
