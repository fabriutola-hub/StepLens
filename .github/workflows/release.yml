name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

# A note on actions versions: we pin to the latest @vN available at the time
# of the 0.8.0 release. GitHub deprecated Node.js 20 on runners in
# September 2025 and the @v4 line of `actions/checkout`, `actions/setup-node`,
# `pnpm/action-setup`, and `docker/*` still runs on Node 20. The @v5
# release line is the first one that supports Node 24 runners natively.

jobs:
  validate:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  npm-pack:
    name: npm pack validation
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Iterate over every publishable workspace package. `pnpm pack --dry-run`
      # mirrors what would go to npm without writing a tarball; failures here
      # usually mean the package's `files`/`main`/`exports`/`bin` point at
      # something that doesn't exist after build.
      - name: Pack @agent-replay/core
        run: pnpm --filter @agent-replay/core pack --dry-run
      - name: Pack @agent-replay/sdk
        run: pnpm --filter @agent-replay/sdk pack --dry-run
      - name: Pack @agent-replay/cli
        run: pnpm --filter @agent-replay/cli pack --dry-run
      - name: Pack @agent-replay/otel
        run: pnpm --filter @agent-replay/otel pack --dry-run
      - name: Pack @agent-replay/studio
        run: pnpm --filter @agent-replay/studio pack --dry-run
      - name: Pack steplens
        run: pnpm --filter steplens pack --dry-run

  npm-publish:
    name: publish to npm
    runs-on: ubuntu-latest
    needs: npm-pack
    # Note: GitHub Actions v3+ rejects `secrets.X` in `if:` expressions to
    # prevent accidental leakage of secret values into logs. We can't directly
    # gate the job on the presence of NPM_TOKEN, so we use a repo variable
    # (`NPM_PUBLISH_DISABLED`) as a manual kill switch, and rely on the
    # credential-less run to fail loudly at publish time.
    if: ${{ vars.NPM_PUBLISH_DISABLED != 'true' }}
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Publish in dependency order.
      - name: Publish @agent-replay/core
        run: pnpm --filter @agent-replay/core publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @agent-replay/sdk
        run: pnpm --filter @agent-replay/sdk publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @agent-replay/otel
        run: pnpm --filter @agent-replay/otel publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @agent-replay/cli
        run: pnpm --filter @agent-replay/cli publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @agent-replay/studio
        run: pnpm --filter @agent-replay/studio publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish steplens
        run: pnpm --filter steplens publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    name: Docker build & push to GHCR
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag_v=v$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          load: false
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/fabriutola-hub/steplens:${{ steps.version.outputs.version }}
            ghcr.io/fabriutola-hub/steplens:${{ steps.version.outputs.tag_v }}
            ghcr.io/fabriutola-hub/steplens:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

  docker-smoke-test:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: docker
    steps:
      # The smoke test job pulls the image we just pushed, so we don't need
      # the source tree. But we still want `setup-node`/`pnpm` for the
      # `npx steplens@… demo` step that records into the running container.
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Pull image
        run: docker pull ghcr.io/fabriutola-hub/steplens:${{ steps.version.outputs.version }}

      - name: Start container
        run: |
          docker run -d --name steplens-test -p 3011:3000 \
            -v steplens-test:/data \
            ghcr.io/fabriutola-hub/steplens:${{ steps.version.outputs.version }}

      - name: Wait for startup
        run: sleep 8

      - name: Health check — /api/traces
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3011/api/traces > /dev/null 2>&1; then
              echo "Studio is up"
              exit 0
            fi
            sleep 2
          done
          echo "Studio did not start in time"
          docker logs steplens-test
          exit 1

      - name: Install steplens CLI
        run: npm install -g steplens@${{ steps.version.outputs.version }} || true

      - name: Run demo against container
        run: |
          npx steplens@${{ steps.version.outputs.version }} demo -e http://localhost:3011 || true

      - name: Cleanup
        if: always()
        run: docker rm -f steplens-test || true
