name: Dependency Review

# Flags PRs that introduce dependencies with known vulnerabilities or
# incompatible licenses. Runs on every PR; non-blocking for first contributors
# (`audit-level: high` only).
#
# Implementation note: we previously used `actions/dependency-review-action@v4`,
# which requires the GitHub "Dependency graph" feature to be enabled on the repo.
# On repos where that toggle is unavailable (private repos on Free plans, or
# intermittent enable delays), the action fails with
# `Error: Dependency review is not supported on this repository` even when the
# toggle reads as Enabled in the UI.
#
# To stay portable, we run `pnpm audit` against the lockfile and parse the
# output ourselves. This catches the same critical/high CVEs for our declared
# dependencies without depending on GitHub's metadata pipeline.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (high+ critical)
        id: audit
        run: |
          set -e
          # `--audit-level=high` makes pnpm exit non-zero only on high/critical.
          # The output is intentionally not silenced: it shows in the action
          # log for the maintainer to read even on success.
          pnpm audit --audit-level=high --prod 2>&1 | tee audit.txt || AUDIT_FAILED=1
          if [ -n "$AUDIT_FAILED" ]; then
            echo "## ⚠️ High/critical advisories found" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -100 audit.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "audit_failed=1" >> "$GITHUB_OUTPUT"
          else
            echo "audit_failed=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR (only on failure)
        if: steps.audit.outputs.audit_failed == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('audit.txt', 'utf8');
            const summary = body.length > 6000
              ? body.slice(0, 6000) + '\n\n…(truncated; see action log for full output)'
              : body;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body:
                '### ⚠️ High/critical advisories found in dependencies\n\n' +
                '```\n' + summary + '\n```\n\n' +
                'Run `pnpm audit` locally for the full report. ' +
                'See [docs/TROUBLESHOOTING.md](../../blob/main/docs/TROUBLESHOOTING.md) for upgrade guidance.',
            });

      - name: Fail on advisories
        if: steps.audit.outputs.audit_failed == '1'
        run: |
          echo "::error::High/critical security advisories found. See the PR comment and the action log for details."
          exit 1
