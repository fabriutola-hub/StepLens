name: Dependency Review

# Flags PRs that introduce dependencies with known vulnerabilities or
# incompatible licenses. Runs on every PR; non-blocking for first contributors
# (`fail-on-severity: high` only).

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          deny-licenses: GPL-3.0, AGPL-3.0
